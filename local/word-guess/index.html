<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, follow">
<title>Word Guess – game frame</title>
<link rel="canonical" href="https://unblockedgames-usa.github.io/game/word-guess/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game.css">
</head>
<body>
<div class="app" id="app">

  <header class="top">
    <div class="top-side">
      <button class="icon-btn" id="btn-help" aria-label="How to play">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.6 2.3c-.8.4-1.2 1-1.2 1.8"/><circle cx="12" cy="16.9" r=".6" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" role="img" aria-label="Word Guess logo" width="26" height="26">
        <rect x="2" y="2" width="16" height="16" rx="3.5" fill="var(--correct)"/>
        <rect x="22" y="2" width="16" height="16" rx="3.5" fill="var(--present)"/>
        <rect x="2" y="22" width="16" height="16" rx="3.5" fill="var(--absent)"/>
        <rect x="22" y="22" width="16" height="16" rx="3.5" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".5"/>
      </svg>
      <span>Word Guess</span>
    </div>
    <div class="top-side right">
      <button class="icon-btn" id="btn-stats" aria-label="Statistics">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <nav class="modes" aria-label="Game mode">
    <button class="mode is-active" data-mode="daily" id="mode-daily">Daily <span class="mode-sub" id="daily-no"></span></button>
    <button class="mode" data-mode="practice" id="mode-practice">Unlimited</button>
  </nav>

  <main class="stage">
    <div class="board" id="board" role="grid" aria-label="Game board"></div>
    <div class="after" id="after" hidden></div>
  </main>

  <section class="keyboard" id="keyboard" aria-label="Keyboard"></section>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" tabindex="-1">
    <button class="modal-close" id="modal-close" aria-label="Close">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
