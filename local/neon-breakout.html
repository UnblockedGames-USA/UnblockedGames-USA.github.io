<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neon Breakout</title>
<style>
  html, body { margin: 0; height: 100%; background: #101013; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'Satoshi', system-ui, sans-serif; }
  canvas { display: block; max-width: 100%; max-height: 100%; touch-action: none; }
</style>
</head>
<body>
<canvas id="c" width="800" height="520"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;

  var state = 'ready'; // ready | playing | over | win
  var score = 0, lives = 3;
  var paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 8 };
  var ball = { x: W / 2, y: H - 90, r: 8, vx: 4, vy: -5 };
  var rows = 6, cols = 10, bw = 64, bh = 22, pad = 8, offX = (W - cols * (bw + pad) + pad) / 2, offY = 60;
  var colors = ['#f4a62a', '#e8863c', '#d96a4a', '#c05258', '#a54a6d', '#8a4a7a'];
  var bricks = [];
  var left = false, right = false;

  function reset() {
    bricks = [];
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      bricks.push({ x: offX + c * (bw + pad), y: offY + r * (bh + pad), w: bw, h: bh, color: colors[r], alive: true });
    }
    score = 0; lives = 3;
    paddle.x = W / 2 - paddle.w / 2;
    ball.x = W / 2; ball.y = H - 90; ball.vx = 4 * (Math.random() > .5 ? 1 : -1); ball.vy = -5;
    state = 'ready';
  }
  reset();

  function movePaddle() {
    if (left) paddle.x -= paddle.speed;
    if (right) paddle.x += paddle.speed;
    paddle.x = Math.max(6, Math.min(W - paddle.w - 6, paddle.x));
  }
  function moveBall() {
    ball.x += ball.vx; ball.y += ball.vy;
    if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -1; }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx *= -1; }
    if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -1; }
    // paddle
    if (ball.y + ball.r >= paddle.y && ball.y < paddle.y + paddle.h &&
        ball.x > paddle.x - ball.r && ball.x < paddle.x + paddle.w + ball.r && ball.vy > 0) {
      ball.vy = -Math.abs(ball.vy);
      var hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      ball.vx = hit * 5.5;
    }
    // bricks
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
        b.alive = false; score += 10;
        var overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        var overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (overlapX < overlapY) ball.vx *= -1; else ball.vy *= -1;
        if (bricks.every(function (x) { return !x.alive; })) state = 'win';
        break;
      }
    }
    if (ball.y > H + 20) {
      lives--;
      if (lives <= 0) { state = 'over'; }
      else { ball.x = W / 2; ball.y = H - 90; ball.vx = 4 * (Math.random() > .5 ? 1 : -1); ball.vy = -5; state = 'ready'; }
    }
  }

  function draw() {
    ctx.fillStyle = '#101013'; ctx.fillRect(0, 0, W, H);
    bricks.forEach(function (b) {
      if (!b.alive) return;
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
    });
    ctx.fillStyle = '#ebebee';
    ctx.beginPath();
    ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
    ctx.fillStyle = '#f4a62a';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#9c9ca6';
    ctx.font = '600 16px system-ui, sans-serif';
    ctx.fillText('Score ' + score, 16, 30);
    ctx.textAlign = 'right';
    ctx.fillText('Lives ' + lives, W - 16, 30);
    ctx.textAlign = 'left';
    if (state === 'ready' || state === 'over' || state === 'win') {
      ctx.fillStyle = 'rgba(16,16,19,.72)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ebebee';
      ctx.font = '600 34px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(state === 'win' ? 'You cleared it!' : state === 'over' ? 'Game over' : 'Neon Breakout', W / 2, H / 2 - 14);
      ctx.font = '16px system-ui, sans-serif';
      ctx.fillStyle = '#9c9ca6';
      ctx.fillText(state === 'ready' ? 'Move with arrow keys or mouse. Click or press Space to launch.' : 'Click or press Space to play again', W / 2, H / 2 + 22);
      ctx.textAlign = 'left';
    }
  }

  function loop() {
    if (state === 'playing') { movePaddle(); moveBall(); }
    draw();
    requestAnimationFrame(loop);
  }
  loop();

  function launch() {
    if (state === 'ready') state = 'playing';
    else if (state === 'over' || state === 'win') reset();
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'a') left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') right = true;
    if (e.key === ' ') { e.preventDefault(); launch(); }
  });
  document.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'a') left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') right = false;
  });
  canvas.addEventListener('pointermove', function (e) {
    var rect = canvas.getBoundingClientRect();
    paddle.x = Math.max(6, Math.min(W - paddle.w - 6, (e.clientX - rect.left) * (W / rect.width) - paddle.w / 2));
  });
  canvas.addEventListener('pointerdown', launch);
})();
</script>
</body>
</html>
