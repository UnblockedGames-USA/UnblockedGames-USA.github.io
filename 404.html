<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found | Unblocked Games USA</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <style>
    /* self-contained: works even when the missing path is nested */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101013;
      color: #ebebee;
      font-family: 'Satoshi', 'Helvetica Neue', sans-serif;
      line-height: 1.6;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 420px; }
    svg { margin: 0 auto 16px; color: #62626d; }
    h1 { font-size: 22px; line-height: 1.2; margin-bottom: 8px; }
    p { color: #9c9ca6; font-size: 15px; margin-bottom: 24px; }
    a {
      display: inline-block;
      background: #f4a62a;
      color: #1c1405;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
    }
    a:hover { background: #ffb640; }
    @media (prefers-color-scheme: light) {
      body { background: #f5f4f0; color: #26251f; }
      h1 { color: #26251f; }
      p { color: #6e6d66; }
    }
  </style>
</head>
<body>
  <main class="box">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 2 2 22h20L12 2z"/><path d="M12 10v4m0 4h.01"/></svg>
    <h1>Page not found</h1>
    <p>That link does not exist on this site.</p>
    <a href="/" id="homeLink">Back to all games</a>
  </main>
  <script>
    /* Instant redirect — zero delay — straight to the site root.
       Uses replace() so the 404 URL is removed from browser history. */
    (function () {
      var SITE_BASE = '/';
      document.getElementById('homeLink').setAttribute('href', SITE_BASE);
      window.location.replace(SITE_BASE);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/" />
  </noscript>
</body>
</html>
